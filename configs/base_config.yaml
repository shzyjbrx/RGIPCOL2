# ─────────────────────────────────────────────
# RGIPCOL  Base Configuration
# ─────────────────────────────────────────────

# ---------- 路径 ----------
clip_model_path: "/home/bingxing2/home/scx6d4e/run/xuanzhenzhen/Troika/code/checkpoints/ViT-L-14.pt"
data_root: "/home/bingxing2/home/scx6d4e/run/xuanzhenzhen/Troika/code/data"
graph_cache_dir: "./graph_data"
experiment_dir: "./experiments"

# ---------- CLIP ----------
clip_model: "ViT-L/14"
image_size: 224
feature_dim: 768

# ---------- 软提示（Soft Prompt） ----------
prefix_length: 3

# ---------- RGCN ----------
rgcn_hidden_dim: 768
rgcn_output_dim: 768
rgcn_num_layers: 2
rgcn_num_relations: 7
rgcn_dropout: 0.3
rgcn_num_bases: -1

# ---------- 训练 ----------
seed: 42
batch_size: 64
num_workers: 0
epochs: 20
optimizer: "adam"
lr: 5.0e-5
weight_decay: 1.0e-5
lr_prefix: 5.0e-5
lr_rgcn: 1.0e-4
lambda_prefix: 1.0e-5
lambda_rgcn: 1.0e-5

# ---------- 评估 ----------
bias_step: 0.001
topk: 1

# ─────────────────────────────────────────────
# 开放世界可行性过滤
# ─────────────────────────────────────────────
#
# 方案 A（双阶段，论文方法）：use_two_stage_filter: true
#   Stage-1：从 feasibility_path .pt 文件读取预计算分数，以 θ₁ 粗筛 → C₁
#   Stage-2：对 C₁ 中的 pair 查询 LLM 物理合理性分数（优先读缓存，缺失则在线生成），以 θ₂ 精筛
#
# 方案 B（单阶段，消融对比）：use_two_stage_filter: false
#   直接用 feasibility_path .pt 文件 + feasibility_threshold 过滤
#
# 两种方案共用 feasibility_path，无需额外 GloVe 文件。
# ─────────────────────────────────────────────

# 是否启用双阶段过滤（各数据集子配置中可覆盖）
use_two_stage_filter: false

# Stage-1 粗筛阈值（θ₁）：应比 feasibility_threshold 更松，确保足够候选进入 Stage-2
feasibility_theta1: 0.3

# Stage-2 LLM 精筛阈值（θ₂）
feasibility_theta2: 0.5

# LLM 分数 JSON 缓存路径（各数据集在子配置中覆盖；不配置则自动推断为 ./LLM/<dataset>_edge_weights.json）
llm_edge_weights_path: null

# LLM 模型（Stage-2 在线生成时使用，与 generate_edge_weights.py 一致）
llm_model_id: "Qwen/Qwen2.5-7B-Instruct"
llm_max_retries: 3

# 官方预计算文件路径（Stage-1 来源 & 方案 B 使用；各数据集子配置中覆盖）
feasibility_path: null
# 方案 B 专用阈值
feasibility_threshold: 0.5

# ---------- 日志 ----------
log_interval: 50
save_best_only: true